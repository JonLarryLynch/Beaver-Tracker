<style>
  /* ================================================================
     Design tokens. Color is reserved for meaning: species colors on pins,
     amber for the one primary action, lake blue for selection and links.
     ================================================================ */
  :root{
    --bg:#E9ECE6; --surface:#FFFFFF; --surface-2:#F3F4F1; --surface-3:#E7EAE4;
    --ink:#1B1F1C; --ink-2:#596159; --ink-3:#8A918B; --line:rgba(27,31,28,.10);
    --accent:#E3A23B; --accent-ink:#382806; --accent-soft:rgba(227,162,59,.16);
    --lake:#2C6A8A; --lake-soft:rgba(44,106,138,.12);
    --good:#3E7B3A; --danger:#B5452A;
    --bark:#2F2419; --sign:#F7F5EF;
    --mk-bg:#FFFFFF;
    --shadow-1:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.09);
    --shadow-2:0 10px 40px rgba(0,0,0,.18);
    --font:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    --display:'Overpass',var(--font);
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --spring:cubic-bezier(.25,1.15,.4,1);
    --ease:cubic-bezier(.2,.8,.2,1);
    --sheet-h:220px;
    --top:max(12px, env(safe-area-inset-top));
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#141614; --surface:#1D201E; --surface-2:#262A27; --surface-3:#313532;
      --ink:#ECEFEC; --ink-2:#A6AEA8; --ink-3:#757D77; --line:rgba(255,255,255,.10);
      --accent:#F0B24E; --accent-ink:#2A1D05; --accent-soft:rgba(240,178,78,.17);
      --lake:#7AB9DA; --lake-soft:rgba(122,185,218,.15);
      --good:#83C27B; --danger:#E27A5E;
      --mk-bg:#232724;
      --shadow-1:0 1px 2px rgba(0,0,0,.45),0 4px 14px rgba(0,0,0,.4);
      --shadow-2:0 10px 40px rgba(0,0,0,.6);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0;padding:0}
  :focus-visible{outline:2px solid var(--lake);outline-offset:2px;border-radius:6px}
  [hidden]{display:none !important}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------- the map is the app ---------- */
  #app{position:fixed;inset:0}
  #map{position:absolute;inset:0;background:var(--bg)}
  .map-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px 24px calc(var(--sheet-h) + 24px);color:var(--ink-2)}
  .leaflet-container{font-family:var(--font);background:var(--bg)}
  /* Plain OpenStreetMap tiles: soften in light mode, invert for dark mode (used until a CARTO key is added) */
  #map.osm .leaflet-tile-pane{filter:saturate(.6) brightness(1.03) contrast(.96)}
  #map.osm-dark .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) saturate(.5) brightness(.9) contrast(.88)}
  /* Built-in basic map (shown underneath, visible whenever map tiles can't load) */
  :root{--water:#C9DCE6;--land:#EEF0EA;--shore:#9FB8C4}
  @media (prefers-color-scheme:dark){:root{--water:#17252D;--land:#1F2320;--shore:#2E4652}}
  #map.leaflet-container{background:var(--water)}
  .land{fill:var(--land);fill-opacity:1;stroke:var(--shore);stroke-width:1.2}
  .lm-label{background:none;border:0;box-shadow:none;color:var(--ink-3);font-weight:600;font-size:11.5px;letter-spacing:.02em;white-space:nowrap;text-shadow:0 0 3px var(--land),0 0 3px var(--land)}
  .lm-label::before{display:none}
  #map.sat .lm-label{color:#fff;text-shadow:0 0 3px #000,0 0 6px #000}
  .basic-chip{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;background:var(--surface);color:var(--ink-2);font-weight:600;font-size:12px;border-radius:999px;padding:6px 11px;box-shadow:var(--shadow-1)}
  .leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 80%,transparent) !important;color:var(--ink-3) !important;font-size:10px !important;border-radius:6px 0 0 0}
  .leaflet-control-attribution a{color:var(--ink-2) !important}
  .leaflet-bar a{background:var(--surface);color:var(--ink);border-color:var(--line)}

  /* ---------- floating brand + controls ---------- */
  .brand{position:absolute;top:var(--top);left:12px;z-index:1100;display:flex;align-items:center;gap:8px;pointer-events:none}
  .sign{pointer-events:auto;display:flex;align-items:center;gap:8px;background:var(--bark);color:var(--sign);border-radius:10px;padding:7px 11px 5px;box-shadow:var(--shadow-1);border:2px solid rgba(247,245,239,.85);outline:2px solid var(--bark)}
  .sign-e{font-size:17px;line-height:1}
  .sign-t{font-family:var(--display);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:12.5px;line-height:1.1}
  .sign-t small{display:block;font-weight:700;font-size:9px;letter-spacing:.16em;opacity:.7}
  .demo-chip{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12px;border-radius:999px;padding:6px 11px;box-shadow:var(--shadow-1)}
  .conn-chip{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;background:var(--surface);color:var(--ink-2);font-weight:600;font-size:12px;border-radius:999px;padding:6px 11px;box-shadow:var(--shadow-1)}
  .conn-chip i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.25}}
  .ctl{position:absolute;top:var(--top);right:12px;z-index:1100;display:flex;flex-direction:column;background:var(--surface);border-radius:12px;box-shadow:var(--shadow-1);overflow:hidden}
  .ctl button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
  .ctl button+button{border-top:1px solid var(--line)}
  .ctl button:hover{color:var(--ink);background:var(--surface-2)}
  .ctl button[aria-pressed="true"]{color:var(--lake)}
  .ctl svg{width:21px;height:21px}

  /* ---------- markers ---------- */
  .mk-wrap{background:none;border:0}
  .mk{width:30px;height:30px;border-radius:50%;background:var(--mk-bg);border:2.5px solid var(--c);display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .15s var(--ease)}
  .mk:hover{transform:scale(1.12)}
  .mk.approx{border-style:dashed}
  .mk.mine{box-shadow:0 0 0 3px var(--accent),0 1px 4px rgba(0,0,0,.3)}
  .mk.sel{transform:scale(1.3);box-shadow:0 0 0 4px var(--lake),0 2px 8px rgba(0,0,0,.35)}
  .mk.drop{animation:drop .7s var(--spring) both}
  @keyframes drop{0%{transform:translateY(-46px) scale(.6);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
  .draft-pin{width:44px;height:44px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;animation:pinIn .45s var(--spring) both}
  .draft-pin span{transform:rotate(45deg);font-size:21px}
  @keyframes pinIn{from{transform:rotate(-45deg) translate(0,-30px) scale(.5);opacity:0}to{transform:rotate(-45deg);opacity:1}}
  .user-dot{width:16px;height:16px;border-radius:50%;background:#2F80ED;border:3px solid #fff;box-shadow:0 0 0 7px rgba(47,128,237,.22)}

  /* ---------- the sheet ---------- */
  .sheet{position:absolute;left:0;right:0;bottom:0;height:var(--sheet-h);z-index:1200;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -2px 30px rgba(0,0,0,.16);display:flex;flex-direction:column;transition:height .5s var(--spring);will-change:height}
  .sheet.dragging{transition:none}
  .grab{flex:none;height:22px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;width:100%}
  .grab i{display:block;width:38px;height:5px;border-radius:3px;background:var(--ink-3);opacity:.4}
  .sheet-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 16px calc(20px + env(safe-area-inset-bottom))}
  .view{animation:viewIn .28s var(--ease) both}
  @keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* type */
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
  .title{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.2;margin:2px 0 0}
  .h{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0}
  .sub{color:var(--ink-2);font-size:14px}
  .muted{color:var(--ink-3)}
  .sec{margin-top:26px}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
  .link{color:var(--lake);font-weight:600;font-size:15px}
  .link:hover{text-decoration:underline}

  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;font-weight:600;font-size:16px;background:var(--surface-2);color:var(--ink);transition:transform .12s var(--ease),background .15s}
  .btn:active{transform:scale(.97)}
  .btn:hover{background:var(--surface-3)}
  .btn-primary{background:var(--accent);color:var(--accent-ink);font-weight:700}
  .btn-primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
  .btn-primary:disabled{opacity:.45;cursor:default;transform:none}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-block{width:100%;min-height:52px;font-size:17px;border-radius:14px}
  .btn-sm{min-height:36px;padding:0 13px;font-size:14px;border-radius:10px}
  .btn-ghost{background:none;color:var(--lake);padding:0 4px}
  .btn-ghost:hover{background:none;text-decoration:underline}
  .icon-btn{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);font-size:17px;flex:none}
  .icon-btn:hover{background:var(--surface-3);color:var(--ink)}
  .input{width:100%;min-height:44px;border:0;border-radius:12px;padding:10px 13px;background:var(--surface-2);font-size:16px}
  .input::placeholder{color:var(--ink-3)}
  textarea.input{min-height:84px;resize:vertical}

  /* peek: best bets */
  .peek{padding-top:2px}
  .peek-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .bets{margin:10px 0 12px}
  .bet{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:7px 4px;border-radius:12px;min-height:48px}
  .bet:hover{background:var(--surface-2)}
  .bet .e{font-size:24px;width:32px;text-align:center;flex:none}
  .bet .b{flex:1;min-width:0}
  .bet .n{font-weight:600;font-size:16px}
  .bet .w{color:var(--ink-2);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bet .t{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:13.5px;text-align:right;flex:none}
  .bet .t b{display:block;color:var(--ink);font-size:15px;font-weight:600}
  .answer{margin:8px 0 14px}
  .answer .a{font-size:21px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
  .answer .a em{font-style:normal;color:var(--lake)}
  .answer .f{color:var(--ink-2);font-size:14px;margin-top:6px}
  .first{background:var(--surface-2);border-radius:14px;padding:14px 16px;margin:10px 0 12px}
  .first .a{font-weight:700;font-size:17px}
  .first .f{color:var(--ink-2);font-size:14px;margin-top:3px}

  /* chips */
  .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;background:var(--surface-2);font-size:14.5px;font-weight:600;color:var(--ink);white-space:nowrap}
  .chip:hover{background:var(--surface-3)}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
  .chip .badge-n{background:var(--lake);color:#fff;border-radius:999px;font-size:11.5px;min-width:18px;height:18px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center}
  .wrapchips{flex-wrap:wrap;overflow:visible;margin:0;padding:0}

  /* grouped list (iOS settings style) */
  .group{background:var(--surface-2);border-radius:14px;overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;min-height:56px;position:relative}
  .row+.row::before{content:'';position:absolute;top:0;left:58px;right:0;height:1px;background:var(--line)}
  button.row:hover,.row.clickable:hover{background:var(--surface-3)}
  .row .av{width:34px;height:34px;border-radius:50%;background:var(--mk-bg);border:2px solid var(--c);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
  .row .b{flex:1;min-width:0}
  .row .n{font-weight:600;font-size:15.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .row .m{color:var(--ink-2);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .chev{color:var(--ink-3);flex:none;font-size:20px}
  .tag{font-size:11px;font-weight:700;letter-spacing:.02em;padding:2px 7px;border-radius:999px;background:var(--surface-3);color:var(--ink-2)}
  .tag.new{background:var(--lake-soft);color:var(--lake)}
  .empty{background:var(--surface-2);border-radius:14px;padding:22px 18px;text-align:center}
  .empty .e{font-size:30px;display:block;margin-bottom:6px}
  .empty .a{font-weight:700;font-size:16px}
  .empty .f{color:var(--ink-2);font-size:14px;margin-top:4px}

  /* patterns */
  .seg{display:flex;background:var(--surface-2);border-radius:10px;padding:2px;gap:2px}
  .seg button{flex:1;min-height:34px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink-2)}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .phases{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .phase{display:flex;align-items:center;gap:10px;font-size:14px}
  .phase .pl{width:104px;flex:none}
  .phase .pl small{display:block;color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
  .bar{flex:1;height:10px;border-radius:5px;background:var(--surface-3);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:5px;background:var(--ink-3);transform-origin:left;animation:grow .6s var(--ease) both}
  .pk .bar i{background:var(--accent)}
  @keyframes grow{from{transform:scaleX(0)}to{transform:none}}
  .v{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:13px;width:28px;text-align:right;flex:none}
  .months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:84px;margin-top:12px}
  .months .m{background:var(--surface-3);border-radius:4px 4px 2px 2px;min-height:4px}
  .months .m.pk{background:var(--accent)}
  .months-l{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:5px;font-size:11px;color:var(--ink-3);text-align:center}
  .rank{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 2px;border-radius:8px;font-size:14.5px}
  .rank:hover{background:var(--surface-2)}
  .rank .lbl{width:150px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rank .bar i{background:var(--lake)}
  .clock-wrap{display:flex;justify-content:center;margin-top:8px}
  .note{color:var(--ink-3);font-size:13px;margin-top:10px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{background:var(--surface-2);border-radius:14px;padding:12px;text-align:center}
  .stat b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .stat span{font-size:12.5px;color:var(--ink-2)}

  /* calm info card (coyotes) */
  details.info{background:var(--surface-2);border-radius:14px;padding:0 14px}
  details.info summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:52px;cursor:pointer;font-weight:600}
  details.info summary::-webkit-details-marker{display:none}
  details.info summary::after{content:'›';margin-left:auto;color:var(--ink-3);font-size:20px;transition:transform .2s var(--ease)}
  details.info[open] summary::after{transform:rotate(90deg)}
  details.info ul{margin:0 0 6px;padding-left:20px;color:var(--ink-2);font-size:14.5px}
  details.info li{margin:4px 0}
  details.info .src{font-size:13px;color:var(--ink-3);padding-bottom:12px}
  details.info a{color:var(--lake)}

  /* detail view */
  .topnav{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px;margin-bottom:4px}
  .back{display:inline-flex;align-items:center;gap:2px;color:var(--lake);font-weight:600;font-size:16px;min-height:40px;padding-right:6px}
  .back span{font-size:24px;line-height:1;margin-top:-2px}
  .d-head{display:flex;align-items:center;gap:14px;margin-top:4px}
  .d-av{width:56px;height:56px;border-radius:50%;background:var(--mk-bg);border:3px solid var(--c);display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
  .d-photo{margin-top:16px;border-radius:14px;overflow:hidden;background:var(--surface-2);min-height:160px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:14px}
  .d-photo img{display:block;width:100%;max-height:340px;object-fit:cover}
  .d-notes{margin-top:14px;font-size:16px;line-height:1.45}
  .facts{margin-top:16px}
  .fact{display:flex;justify-content:space-between;gap:16px;padding:12px 14px;font-size:15px}
  .fact+.fact{border-top:1px solid var(--line)}
  .fact span:first-child{color:var(--ink-2)}
  .fact span:last-child{text-align:right}
  .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .actions .btn{flex:1}

  /* log flow */
  .steps{display:flex;gap:5px}
  .steps i{width:22px;height:4px;border-radius:2px;background:var(--surface-3);transition:background .25s}
  .steps i.on{background:var(--accent)}
  .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
  .tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--surface-2);border-radius:14px;padding:12px 4px 10px;min-height:88px;text-align:center;transition:transform .12s var(--ease),background .15s}
  .tile:hover{background:var(--surface-3)}
  .tile:active{transform:scale(.96)}
  .tile .e{font-size:32px;line-height:1.05}
  .tile .n{font-size:13px;font-weight:600;line-height:1.15;color:var(--ink)}
  .tile[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
  .grp-l{margin:18px 0 0;font-size:13px;font-weight:600;color:var(--ink-2)}
  .where{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:14px;padding:12px 14px;margin:12px 0}
  .where .e{font-size:22px}
  .where .a{font-weight:600}
  .where .f{color:var(--ink-2);font-size:13.5px}
  .two{display:flex;gap:8px}
  .two .btn{flex:1}
  .sum{margin-top:12px}
  .sum .row{min-height:52px}
  .sum .row .k{color:var(--ink-2);font-size:13px}
  .sum .row .chg{color:var(--lake);font-weight:600;font-size:15px;flex:none}
  .fl{display:block;font-size:13.5px;font-weight:600;color:var(--ink-2);margin:16px 0 8px}
  details.more{margin-top:14px}
  details.more>summary{list-style:none;cursor:pointer;color:var(--lake);font-weight:600;font-size:16px;min-height:44px;display:flex;align-items:center;gap:6px}
  details.more>summary::-webkit-details-marker{display:none}
  details.more>summary::after{content:'›';font-size:20px;transition:transform .2s var(--ease)}
  details.more[open]>summary::after{transform:rotate(90deg)}
  .stepper{display:inline-flex;align-items:center;background:var(--surface-2);border-radius:12px;overflow:hidden}
  .stepper button{width:44px;height:44px;font-size:20px;font-weight:600;color:var(--ink)}
  .stepper button:hover{background:var(--surface-3)}
  .stepper output{min-width:40px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
  .check-line{display:flex;gap:12px;align-items:flex-start;margin-top:16px;font-size:15px;cursor:pointer}
  .check-line input{width:22px;height:22px;margin-top:0;accent-color:var(--accent);flex:none}
  .check-line small{display:block;color:var(--ink-2);font-size:13px;margin-top:2px}
  .nudge{margin-top:10px;font-size:13.5px;color:var(--ink);background:var(--accent-soft);border-radius:10px;padding:9px 12px}
  .photo-prev{display:block;max-width:100%;max-height:180px;border-radius:12px;margin-top:10px}
  .file-btn{position:relative;overflow:hidden}
  .file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .log-foot{position:sticky;bottom:0;background:linear-gradient(transparent,var(--surface) 30%);padding:18px 0 4px;margin-top:8px}
  .needs{color:var(--ink-2);font-size:13.5px;text-align:center;margin:0 0 8px;min-height:18px}

  /* done */
  .done{text-align:center;padding:12px 6px 4px}
  .done svg{width:76px;height:76px;margin:6px auto 10px;display:block}
  .done circle{fill:none;stroke:var(--good);stroke-width:4;stroke-dasharray:220;stroke-dashoffset:220;animation:draw .6s var(--ease) forwards}
  .done path{fill:none;stroke:var(--good);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .35s .45s var(--ease) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .done .a{font-size:24px;font-weight:700}
  .done .f{color:var(--ink-2);font-size:15.5px;margin-top:4px}
  .done .tip{margin-top:14px;font-size:14px;color:var(--ink-2);background:var(--surface-2);border-radius:12px;padding:10px 12px;text-align:left}

  /* modal / action sheet */
  .modal-bd{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:3000;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s both}
  @keyframes fade{from{opacity:0}}
  .modal{background:var(--surface);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--shadow-2);max-height:88dvh;overflow:auto;animation:up .38s var(--spring) both}
  @keyframes up{from{transform:translateY(40px);opacity:.4}}
  .modal h3{margin:0 0 6px;font-size:20px;font-weight:700}
  .modal p{margin:0 0 12px;color:var(--ink-2)}
  .modal .input{margin-top:4px}
  .modal-actions{display:flex;gap:8px;margin-top:18px}
  .modal-actions .btn{flex:1}
  .menu .row{min-height:52px;font-size:16px}
  .menu .row .ic{width:28px;text-align:center;font-size:18px;flex:none}
  .check-row{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 4px;font-size:15.5px;cursor:pointer}
  .check-row input{width:20px;height:20px;accent-color:var(--lake);flex:none}
  .check-row .n{margin-left:auto;color:var(--ink-3);font-size:13px;font-variant-numeric:tabular-nums}
  .pop-group{font-size:13px;font-weight:600;color:var(--ink-2);margin:16px 4px 4px}
  @media (min-width:600px){.modal-bd{align-items:center;padding:16px}.modal{border-radius:18px;padding:22px}}

  /* toasts */
  #toasts{position:fixed;left:50%;bottom:calc(var(--sheet-h) + 12px);transform:translateX(-50%);z-index:3500;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px;transition:bottom .5s var(--spring)}
  .toast{background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:14px;font-size:14.5px;font-weight:600;box-shadow:var(--shadow-2);text-align:center;animation:up .35s var(--spring) both;transition:opacity .25s,transform .25s}
  .toast.warn{background:var(--danger);color:#fff}
  .toast.out{opacity:0;transform:translateY(8px)}

  /* phones: keep map attribution above the sheet */
  @media (max-width:860px){
    .brand{flex-direction:column;align-items:flex-start;gap:6px}
    .leaflet-bottom{bottom:var(--sheet-h);transition:bottom .5s var(--spring)}
    body.sheet-full .leaflet-bottom{display:none}
    .leaflet-control-zoom{display:none}
  }
  /* desktop: the sheet becomes a floating sidebar */
  @media (min-width:861px){
    .brand{left:16px;top:16px}
    .ctl{right:16px;top:16px}
    .sheet{left:16px;top:76px;bottom:16px;right:auto;width:400px;height:auto !important;border-radius:18px;box-shadow:var(--shadow-2);transition:none}
    .grab{height:14px;cursor:default}
    .grab i{display:none}
    #toasts{bottom:24px;left:calc(50% + 208px)}

</head>
<body>
<div id="app">
  <div id="map" role="application" aria-label="Map of Lincoln Park with wildlife sightings"></div>
  <div class="map-fallback" id="mapFallback" hidden>The map couldn’t load here. Sightings and patterns are still in the panel.</div>

  <div class="brand">
    <div class="sign" role="img" aria-label="Lincoln Park Wildlife Watch"><span class="sign-e" aria-hidden="true">🦫</span><span class="sign-t">Wildlife Watch<small>Lincoln Park</small></span></div>
    <button class="conn-chip" id="connChip" type="button" hidden><i></i>Connecting</button>
    <button class="demo-chip" id="demoChip" type="button" hidden>Demo · sample data</button>
    <button class="basic-chip" id="basicChip" type="button" hidden>Basic map</button>
  </div>

  <div class="ctl" role="toolbar" aria-label="Map controls">
    <button type="button" id="menuBtn" aria-label="Menu" title="Menu"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
    <button type="button" id="heatBtn" aria-label="Map style and heatmap" title="Map style"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 3 7.5l9 4.5 9-4.5L12 3Z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/></svg></button>
    <button type="button" id="locateBtn" aria-label="Center on my location" title="My location"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 3 3 10.5l7.5 3 3 7.5L21 3Z"/></svg></button>
  </div>

  <section class="sheet" id="sheet" aria-label="Sightings panel">
    <div class="grab" id="grab" role="button" tabindex="0" aria-label="Resize panel"><i></i></div>
    <div class="sheet-body" id="sheetBody">
      <div id="viewHome" class="view"></div>
      <div id="viewDetail" class="view" hidden></div>
      <div id="viewLog" class="view" hidden></div>
    </div>
  </section>
</div>

<div class="modal-bd" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"><button class="btn" type="button" id="modalCancel">Cancel</button><button class="btn btn-primary" type="button" id="modalOk">OK</button></div>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>

  for(const [d, word] of [[dm, 'today'], [d0, 'today'], [d1, 'tomorrow']]){
    const [a, b] = win(d, key);
    if(now >= a && now < b) return { big:'Now', small:'until ' + clockTime(b), now:true };

  const s = sunFor(new Date()), p = PHASES.find(x => x.key === key);

      field.className = 'input'; field.placeholder = o.input.placeholder || ''; field.value = o.input.value || '';

    ok.className = 'btn ' + (o.danger ? 'btn-danger' : 'btn-primary');
    cancel.textContent = o.cancelText || 'Cancel';

    const prev = document.activeElement;
    bd.hidden = false;

    function close(v){
      bd.hidden = true; ok.onclick = cancel.onclick = bd.onclick = null;

    ok.onclick = () => close(field ? field.value : true);
    cancel.onclick = () => close(null);
    bd.onclick = e => { if(e.target === bd) close(null); };
    document.addEventListener('keydown', onKey);
    if(o.onOpen) o.onOpen(body, close);

}

function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  const w = new Array(len).fill(base || 0.02);
  bumps.forEach(([c, width, h]) => {
    for(let i = 0; i < len; i++){
      let d = Math.abs(i - c); d = Math.min(d, len - d);

const Cloud = { db:null, auth:null, unsub:null };

function explainError(e){
  const c = (e && e.code) || '';
  if(c === 'auth/operation-not-allowed' || c === 'auth/admin-restricted-operation') return 'Anonymous sign-in is switched off in Firebase (Authentication → Sign-in method → Anonymous).';
  if(c === 'auth/unauthorized-domain') return 'This web address isn’t on Firebase’s Authorized domains list (Authentication → Settings).';
  if(c === 'permission-denied') return 'Firestore security rules blocked reading sightings.';
  if(c === 'timeout' || c === 'unavailable' || c === 'auth/network-request-failed') return 'Couldn’t reach Firebase from here.';
  return 'Couldn’t connect to the shared database' + (c ? ' (' + c + ')' : '') + '.';
}

function goDemo(reason){
  const wasCloud = state.mode === 'cloud';
  if(Cloud.unsub){ try{ Cloud.unsub(); }catch(e){} Cloud.unsub = null; }
  state.mode = 'demo'; state.modeReason = reason; state.uid = localUid;
  if(wasCloud || !state.sightings.length) state.sightings = Demo.load();
  renderAll();
}

async function connectCloud(){
  const q = new URLSearchParams(location.search);
  if(q.has('demo')) return goDemo('Demo mode is on because the address ends in ?demo.');
  if(location.protocol === 'file:') return goDemo('This page was opened as a file on your computer, so it can’t reach the shared database.');
  try{
    await loadScript(FB_BASE + 'firebase-app-compat.js', 8000);
    await Promise.all([loadScript(FB_BASE + 'firebase-auth-compat.js', 8000), loadScript(FB_BASE + 'firebase-firestore-compat.js', 8000)]);
  }catch(e){
    return goDemo('The Firebase library couldn’t load here. Chat previews and some networks block it.');
  }
  try{
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    Cloud.auth = firebase.auth(); Cloud.db = firebase.firestore();
    const cred = await withTimeout(Cloud.auth.signInAnonymously(), 10000, 'Sign-in timed out');
    state.uid = cred.user.uid;
  }catch(e){
    return goDemo(explainError(e));
  }
  Cloud.unsub = Cloud.db.collection('sightings').onSnapshot(snap => {
    const first = state.mode !== 'cloud';
    if(!first) snap.docChanges().forEach(ch => { if(ch.type === 'added') maybeAlert(Object.assign({}, ch.doc.data(), { id: ch.doc.id })); });
    state.sightings = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id }));
    if(first){ state.mode = 'cloud'; state.modeReason = 'Connected. Sightings you log are shared with everyone who visits.'; }
    renderAll();
  }, err => goDemo(explainError(err)));
}

/* Photos live in their own documents (photos/{sightingId}) so the map and list never download them.
   They're fetched only when someone opens a sighting. Older sightings may still carry an inline photo. */
const photoCache = new Map();
async function getPhoto(s){
  const inline = safeImg(s.photo) || safeImg(s.photoUrl);
  if(inline) return inline;
  if(!s.hasPhoto) return null;
  if(photoCache.has(s.id)) return photoCache.get(s.id);
  let data = null;
  if(state.mode === 'cloud'){
    const doc = await withTimeout(Cloud.db.collection('photos').doc(s.id).get(), 10000, 'Photo timed out');
    data = doc.exists ? safeImg(doc.data().data) : null;
  } else data = safeImg(Demo.photos()[s.id]);
  photoCache.set(s.id, data);
  return data;
}

// photoOp: undefined = leave photo alone, null = remove it, 'data:...' = set it.
async function persist(entry, isNew, photoOp, prev){
  if(state.mode === 'cloud'){
    const batch = Cloud.db.batch();
    batch.set(Cloud.db.collection('sightings').doc(entry.id), entry);
    if(isNew){
      // A per-user "last posted" stamp written with each new sighting; the rules use it for the 20-second limit.
      batch.set(Cloud.db.collection('limits').doc(state.uid), { last: firebase.firestore.FieldValue.serverTimestamp() });
    }
    if(typeof photoOp === 'string') batch.set(Cloud.db.collection('photos').doc(entry.id), { data: photoOp, reporterId: state.uid });
    else if(photoOp === null && prev && prev.hasPhoto) batch.delete(Cloud.db.collection('photos').doc(entry.id));
    await withTimeout(batch.commit(), 15000, 'Saving timed out');
  } else {
    Demo.save(entry, photoOp);
    const i = state.sightings.findIndex(s => s.id === entry.id);
    if(i >= 0) state.sightings[i] = entry; else state.sightings.push(entry);
  }
  if(photoOp !== undefined){ if(photoOp) photoCache.set(entry.id, photoOp); else photoCache.delete(entry.id); }
}
async function removeSighting(s){
  if(state.mode === 'cloud'){
    const batch = Cloud.db.batch();
    batch.delete(Cloud.db.collection('sightings').doc(s.id));
    if(s.hasPhoto) batch.delete(Cloud.db.collection('photos').doc(s.id));
    await withTimeout(batch.commit(), 12000, 'Delete timed out');
  } else {
    Demo.remove(s.id);
    state.sightings = state.sightings.filter(x => x.id !== s.id);
    renderAll();
  }
}

/* ================================================================
   FILTERING + ANALYSIS
   ================================================================ */
function rangeBounds(){
  const f = state.filters;
  if(f.range === 'all') return [-Infinity, Infinity];
  if(f.range === 'custom') return [f.from ? Date.parse(f.from + 'T00:00:00') : -Infinity, f.to ? Date.parse(f.to + 'T23:59:59') : Infinity];
  return [Date.now() - Number(f.range) * 86400000, Infinity];
}
function inRange(s){ const [a, b] = rangeBounds(), t = Date.parse(s.timestamp); return t >= a && t <= b; }
function valid(s){ return isFinite(s.lat) && isFinite(s.lng) && !isNaN(Date.parse(s.timestamp)); }
function filtered(){
  return state.sightings
    .filter(s => valid(s) && state.filters.species.has(spKey(s)) && inRange(s))
    .sort((x, y) => Date.parse(y.timestamp) - Date.parse(x.timestamp));
}
function focusKey(){ return state.filters.species.size === 1 ? Array.from(state.filters.species)[0] : null; }
function allSpeciesOn(){ return state.filters.species.size === SPECIES_KEYS.length; }
function isMine(s){ return s.reporterId && s.reporterId === state.uid; }

function bestWindow(counts, len){
  const n = counts.length; let best = 0, bv = -1;
  for(let i = 0; i < n; i++){ let v = 0; for(let j = 0; j < len; j++) v += counts[(i + j) % n]; if(v > bv){ bv = v; best = i; } }
  return { start: best, total: bv };
}
function monthRange(start, len){ const a = MONTHS[start], b = MONTHS[(start + len - 1) % 12]; return len === 1 ? a : `${a}–${b}`; }
// Everything the patterns need, for one set of sightings.
function analyze(sub){
  const n = sub.length, hours = new Array(24).fill(0), months = new Array(12).fill(0), spots = {};
  const pc = {}, plen = {};
  PHASES.forEach(p => { pc[p.key] = 0; plen[p.key] = 0; });
  sub.forEach(s => {
    const d = new Date(s.timestamp); hours[d.getHours()]++; months[d.getMonth()]++;
    const l = nearestLandmark(s.lat, s.lng); const k = l ? l.name : 'Elsewhere in the park'; spots[k] = (spots[k] || 0) + 1;
    pc[phaseOf(s.timestamp)]++;
    const sun = sunFor(d); let used = 0;
    PHASES.slice(0, -1).forEach(p => { const len = (p.to(sun) - p.from(sun)) / H; plen[p.key] += len; used += len; });
    plen.night += 24 - used;
  });
  // Ranked by sightings per hour, because "late night" lasts far longer than "dusk".
  const rate = k => n ? pc[k] / Math.max(0.5, plen[k] / n) : 0;
  const peakPhase = PHASES.map(p => p.key).sort((a, b) => rate(b) - rate(a))[0];
  const spotList = Object.entries(spots).sort((a, b) => b[1] - a[1]);
  const topSpot = (spotList.find(([k]) => k !== 'Elsewhere in the park') || [null])[0];
  return { n, hours, months, pc, peakPhase, spotList, topSpot, hw: bestWindow(hours, 2), mw: bestWindow(months, 3) };
}
// Tonight's best bets: the most-seen species with enough data for a pattern.
function bestBets(){
  const pool = state.sightings.filter(s => valid(s) && inRange(s));
  const by = {};
  pool.forEach(s => { const k = spKey(s); if(k === 'other') return; (by[k] = by[k] || []).push(s); });
  return Object.entries(by).filter(([, l]) => l.length >= 5).sort((a, b) => b[1].length - a[1].length).slice(0, 3)
    .map(([k, l]) => Object.assign({ key:k }, analyze(l)));
}
function lastSeen(key){
  const l = state.sightings.filter(s => valid(s) && (!key || spKey(s) === key)).sort((a, b) => Date.parse(b.timestamp) - Date.parse(a.timestamp));
  return l[0] || null;
}

/* ================================================================
   MAP
   ================================================================ */
let labelLayer = null, tilesOk = false, tileErrors = 0, basicShown = false;
let map = null, tileLayer = null, markerLayer = null, heatLayer = null, draftMarker = null, userDot = null;
const markerById = new Map();

function setTiles(){
  if(!map) return;
  const dark = darkQuery && darkQuery.matches, sat = state.base === 'sat';
  if(tileLayer) map.removeLayer(tileLayer);
  tilesOk = false; tileErrors = 0;
  tileLayer = sat
    ? L.tileLayer(SAT.url, { maxZoom:19, maxNativeZoom: SAT.maxNativeZoom, attribution: SAT.attribution })
    : L.tileLayer(dark ? TILES.dark : TILES.light, { maxZoom:19, subdomains: TILES.subdomains, attribution: TILES.attribution });
  tileLayer.addTo(map);
  $('#map').classList.toggle('osm-dark', !sat && dark && !TILES.carto);
  $('#map').classList.toggle('osm', !sat && !TILES.carto);
  $('#map').classList.toggle('sat', sat);
  const layer = tileLayer;
  layer.on('tileload', () => { if(layer !== tileLayer) return; tilesOk = true; if(basicShown) showBasic(false); });
  layer.on('tileerror', () => { if(layer !== tileLayer) return; tileErrors++; if(!tilesOk && tileErrors >= 2) showBasic(true); });
  setTimeout(() => { if(layer === tileLayer && !tilesOk) showBasic(true); }, 6000);
  updateLabels();
}
// Landmark names show on the basic map and on satellite (which has no names of its own).
function updateLabels(){
  if(!map || !labelLayer) return;
  const want = basicShown || state.base === 'sat';
  if(want && !map.hasLayer(labelLayer)) labelLayer.addTo(map);
  if(!want && map.hasLayer(labelLayer)) map.removeLayer(labelLayer);
}
// When map tiles can't load (blocked in some previews and networks), show the built-in basic map.
function showBasic(on){
  if(!map || on === basicShown) return;
  basicShown = on;
  updateLabels();
  $('#map').classList.toggle('basic', on);
  $('#basicChip').hidden = !on;
}
function initMap(){
  if(typeof L === 'undefined'){ $('#mapFallback').hidden = false; $('#heatBtn').hidden = true; $('#locateBtn').hidden = true; return; }
  map = L.map('map', { zoomControl:false, minZoom:12, maxZoom:19, attributionControl:true,
    maxBounds: L.latLngBounds([41.85, -87.78], [42.03, -87.52]), maxBoundsViscosity: 0.8 }).setView(PARK_CENTER, 14);
  // A basic map built into the page: land, lake and landmark names. Tiles cover it when they load.
  map.createPane('base'); map.getPane('base').style.zIndex = 150;
  L.geoJSON(LAND, { pane:'base', interactive:false, style:{ className:'land' } }).addTo(map);
  labelLayer = L.layerGroup(LANDMARKS.map(l => L.tooltip({ permanent:true, direction:'left', offset:[-18, 0], className:'lm-label', interactive:false }).setLatLng([l.lat, l.lng]).setContent(esc(l.name))));
  setTiles();
  if(isDesktop()) L.control.zoom({ position:'bottomright' }).addTo(map);
  map.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');
  if(darkQuery){ const f = () => { setTiles(); renderMap(); }; darkQuery.addEventListener ? darkQuery.addEventListener('change', f) : darkQuery.addListener(f); }
  markerLayer = L.layerGroup().addTo(map);
  map.on('click', e => {
    if(state.view === 'log' && state.log.step === 2){ placeDraft(e.latlng, 'map'); return; }
    if(state.view === 'detail') goHome();
  });
  window.addEventListener('resize', () => { map.invalidateSize(); applySheet(); });
}
function sightIcon(s){
  const cls = 'mk' + (s.precision === 'approximate' ? ' approx' : '') + (isMine(s) ? ' mine' : '') + (state.detailId === s.id ? ' sel' : '') + (state.justLogged === s.id ? ' drop' : '');
  return L.divIcon({ className:'mk-wrap', html:`<div class="${cls}" style="--c:${colorOf(spKey(s))}">${sp(s.species).emoji}</div>`, iconSize:[30,30], iconAnchor:[15,15] });
}
function draftIcon(){
  const e = state.log && state.log.draft.species ? sp(state.log.draft.species).emoji : '📍';
  return L.divIcon({ className:'mk-wrap', html:`<div class="draft-pin"><span>${e}</span></div>`, iconSize:[44,44], iconAnchor:[22,46] });
}
function renderMap(){
  if(!map) return;
  markerLayer.clearLayers(); markerById.clear();
  if(heatLayer){ map.removeLayer(heatLayer); heatLayer = null; }
  const list = filtered();
  if(state.heat && typeof L.heatLayer === 'function'){
    heatLayer = L.heatLayer(list.map(s => [s.lat, s.lng, 0.6]), { radius:26, blur:20, maxZoom:17, gradient:{0.3:'#2C6A8A',0.6:'#E3A23B',1:'#B5452A'} }).addTo(map);
    return;
  }
  list.forEach(s => {
    const m = L.marker([s.lat, s.lng], { icon: sightIcon(s), title: labelOf(s), riseOnHover:true, keyboard:true });
    m.on('click', () => {
      if(state.view === 'log' && state.log.step === 2){ placeDraft({ lat:s.lat, lng:s.lng }, 'marker'); return; }
      openDetail(s.id, false);
    });
    markerLayer.addLayer(m); markerById.set(s.id, m);
  });
}
// Fly so the point lands in the middle of the part of the map the sheet isn't covering.
function flyToVisible(latlng, zoom){
  if(!map) return;
  zoom = zoom || Math.max(map.getZoom(), 16);
  const size = map.getSize();
  let cx = size.x / 2, cy = size.y / 2;
  if(isDesktop()) cx = 432 + (size.x - 432) / 2;
  else cy = (size.y - sheetTarget()) / 2 + 10;
  const p = map.project(latlng, zoom).subtract(L.point(cx - size.x / 2, cy - size.y / 2));
  map.flyTo(map.unproject(p, zoom), zoom, { duration:0.7 });
}
function placeDraft(latlng, source){
  const lg = state.log; if(!lg) return;
  lg.draft.latlng = { lat: latlng.lat, lng: latlng.lng }; lg.draft.locSource = source;
  if(map){
    if(draftMarker){ draftMarker.setLatLng(latlng); draftMarker.setIcon(draftIcon()); }
    else {
      draftMarker = L.marker(latlng, { icon: draftIcon(), draggable:true, autoPan:true, zIndexOffset:1000, keyboard:false }).addTo(map);
      draftMarker.on('dragend', () => { const p = draftMarker.getLatLng(); lg.draft.latlng = { lat:p.lat, lng:p.lng }; lg.draft.locSource = 'drag'; if(lg.step === 2) renderLog(); });
    }
    if(source === 'gps' || source === 'edit') flyToVisible(latlng, Math.max(map.getZoom(), 18));
  }
  if(lg.step === 2) renderLog();
}
function clearDraftMarker(){ if(draftMarker && map) map.removeLayer(draftMarker); draftMarker = null; }

function locate(onPoint, quiet){
  if(!navigator.geolocation){ if(!quiet) toast('Location isn’t available in this browser. Tap the map instead.', 'warn'); onPoint(null); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    const ll = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    if(map){
      if(userDot) userDot.setLatLng(ll);
      else userDot = L.marker(ll, { icon: L.divIcon({ className:'mk-wrap', html:'<div class="user-dot"></div>', iconSize:[16,16], iconAnchor:[8,8] }), interactive:false, keyboard:false }).addTo(map);
    }
    onPoint(ll);
  }, () => { if(!quiet) toast('Couldn’t get your location. Tap the map instead.', 'warn'); onPoint(null); },
  { enableHighAccuracy:true, timeout:8000, maximumAge:60000 });
}

/* ================================================================
   SHEET (bottom sheet on phones, floating sidebar on desktop)
   ================================================================ */
const sheet = { detent:'peek', h:0 };
function vh(){ return window.innerHeight; }
function detentHeight(d){
  const top = Math.max(12, parseInt(getComputedStyle(document.documentElement).getPropertyValue('--top')) || 12);
  const full = vh() - top - 56;
  if(d === 'full') return full;
  if(d === 'half') return Math.min(full, Math.round(vh() * 0.52));
  if(d === 'fit'){
    const v = currentView(); const h = (v ? v.scrollHeight : 300) + 22 + 26;
    return Math.min(full, Math.max(200, h));
  }
  // peek: just the best bets and the log button
  const pk = $('#peek'); const h = pk ? pk.offsetHeight : 180;
  return Math.min(full, h + 22 + 14);
}
function sheetTarget(){ return isDesktop() ? 0 : detentHeight(sheet.detent); }
function currentView(){ return state.view === 'home' ? $('#viewHome') : state.view === 'detail' ? $('#viewDetail') : $('#viewLog'); }
function setDetent(d){ sheet.detent = d; applySheet(); }
function applySheet(){
  if(isDesktop()){ document.documentElement.style.setProperty('--sheet-h', '0px'); return; }
  sheet.h = detentHeight(sheet.detent);
  document.documentElement.style.setProperty('--sheet-h', sheet.h + 'px');
  document.body.classList.toggle('sheet-full', sheet.h > vh() * 0.75);
}
function wireSheet(){
  const el = $('#sheet'), grab = $('#grab'), body = $('#sheetBody');
  let startY = 0, startH = 0, dragging = false, moved = false, lastY = 0, lastT = 0, vel = 0;
  function down(e){
    if(isDesktop()) return;
    dragging = true; moved = false; startY = lastY = e.clientY; lastT = performance.now(); startH = sheet.h || el.offsetHeight; vel = 0;
    el.classList.add('dragging');
    try{ grab.setPointerCapture(e.pointerId); }catch(err){}
  }
  function move(e){
    if(!dragging) return;
    const dy = e.clientY - startY; if(Math.abs(dy) > 4) moved = true;
    const now = performance.now(); vel = (e.clientY - lastY) / Math.max(1, now - lastT); lastY = e.clientY; lastT = now;
    const h = Math.max(120, Math.min(detentHeight('full') + 30, startH - dy));
    sheet.h = h; document.documentElement.style.setProperty('--sheet-h', h + 'px');
  }
  function up(){
    if(!dragging) return;
    dragging = false; el.classList.remove('dragging');
    const order = allowedDetents();
    if(!moved){ // tap on the grabber cycles through sizes
      const i = order.indexOf(sheet.detent); setDetent(order[(i + 1) % order.length]); return;
    }
    // flick: follow the direction; slow drag: snap to the nearest size
    let target;
    if(Math.abs(vel) > 0.5){
      const sorted = order.slice().sort((a, b) => detentHeight(a) - detentHeight(b));
      target = vel < 0 ? sorted.find(d => detentHeight(d) > sheet.h + 10) || sorted[sorted.length - 1]
                       : sorted.slice().reverse().find(d => detentHeight(d) < sheet.h - 10) || sorted[0];
    } else target = order.reduce((best, d) => Math.abs(detentHeight(d) - sheet.h) < Math.abs(detentHeight(best) - sheet.h) ? d : best, order[0]);
    setDetent(target);
  }
  grab.addEventListener('pointerdown', down);
  grab.addEventListener('pointermove', move);
  grab.addEventListener('pointerup', up);
  grab.addEventListener('pointercancel', up);
  grab.addEventListener('keydown', e => {
    const order = allowedDetents().slice().sort((a, b) => detentHeight(a) - detentHeight(b)); const i = order.indexOf(sheet.detent);
    if(e.key === 'ArrowUp'){ e.preventDefault(); setDetent(order[Math.min(order.length - 1, i + 1)]); }
    if(e.key === 'ArrowDown'){ e.preventDefault(); setDetent(order[Math.max(0, i - 1)]); }
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); setDetent(order[(i + 1) % order.length]); }
  });
  // Scrolling the content while the sheet is small first grows the sheet, like Apple Maps.
  body.addEventListener('wheel', e => { if(!isDesktop() && e.deltaY > 0 && sheet.detent === 'peek' && state.view === 'home'){ setDetent('half'); } }, { passive:true });
  let ty = 0;
  body.addEventListener('touchstart', e => { ty = e.touches[0].clientY; }, { passive:true });
  body.addEventListener('touchmove', e => {
    if(isDesktop() || state.view !== 'home') return;
    const dy = e.touches[0].clientY - ty;
    if(dy < -24 && sheet.detent === 'peek'){ setDetent('half'); ty = e.touches[0].clientY; }
    else if(dy < -24 && sheet.detent === 'half' && body.scrollTop + body.clientHeight >= body.scrollHeight - 2){ setDetent('full'); ty = e.touches[0].clientY; }
    else if(dy > 40 && body.scrollTop <= 0 && sheet.detent !== 'peek'){ setDetent(sheet.detent === 'full' ? 'half' : 'peek'); ty = e.touches[0].clientY; }
  }, { passive:true });
}
function allowedDetents(){
  if(state.view === 'home') return ['peek','half','full'];
  if(state.view === 'detail') return ['half','full'];
  if(state.log && state.log.step === 2) return ['fit','half'];
  return ['full','half'];
}
function showView(v){
  state.view = v;
  $('#viewHome').hidden = v !== 'home'; $('#viewDetail').hidden = v !== 'detail'; $('#viewLog').hidden = v !== 'log';
  const cv = currentView(); cv.classList.remove('view'); void cv.offsetWidth; cv.classList.add('view');
  $('#sheetBody').scrollTop = 0;
}

function rowHtml(s){
  return `<button class="row" type="button" data-open="${esc(s.id)}" style="--c:${colorOf(spKey(s))}">
    <span class="av" aria-hidden="true">${sp(s.species).emoji}</span>
    <span class="b"><span class="n">${esc(labelOf(s))}${(s.count || 1) > 1 ? ' <span class="muted">× ' + Number(s.count) + '</span>' : ''}${s.sample ? ' <span class="tag">Sample</span>' : ''}${hasPhoto(s) ? ' <span aria-label="has a photo">📷</span>' : ''}</span>
    <span class="m">${esc(relTime(s.timestamp))} · ${esc(placeOf(s))}</span></span>
    <span class="chev" aria-hidden="true">›</span></button>`;
}
function peekHtml(){
  const fk = focusKey();
  const btn = `<button class="btn btn-primary btn-block" type="button" data-go="log">＋ Log a sighting</button>`;
  if(fk){
    const sub = filtered(), a = analyze(sub), name = pluralOf(fk);
    let body;
    if(a.n >= 5){
      const t = phaseToday(a.peakPhase);
      body = `<div class="answer"><div class="a">${esc(name)}: <em>${PHRASE[a.peakPhase].toLowerCase()}</em>${a.topSpot ? ' near <em>' + esc(a.topSpot) + '</em>' : ''}.</div>
        <div class="f">${PHRASE[a.peakPhase]} is ${esc(t.range)}. Busiest months ${monthRange(a.mw.start, 3)}.</div></div>`;
    } else {
      const ls = lastSeen(fk);
      const one = a.n === 1 ? nameOf(fk).toLowerCase() : name.toLowerCase();
      body = `<div class="first"><div class="a">${a.n ? 'Only ' + a.n + ' ' + esc(one) + ' logged ' + (state.filters.range === 'all' ? 'so far' : esc(rangePhrase())) : 'No ' + esc(name.toLowerCase()) + ' logged ' + esc(rangePhrase())}</div>
        <div class="f">${ls ? 'Last seen ' + esc(fmtDay(ls.timestamp)) + ' ' + esc(placeOf(ls)) + '. ' : ''}Patterns appear after 5 sightings.</div></div>`;
    }
    return `<div class="peek" id="peek"><div class="peek-head"><div><div class="eyebrow">Best chance to see</div></div>
      <button class="btn-ghost link" type="button" data-all="1" style="font-size:14.5px">All wildlife</button></div>${body}${btn}</div>`;
  }
  const bets = bestBets();
  if(!bets.length){
    const ls = lastSeen();
    const head = state.mode === 'connecting' ? 'Loading sightings…' : ls ? 'Quiet lately' : 'No sightings yet';
    const f = state.mode === 'connecting' ? '' : ls ? `The last sighting was a ${esc(labelOf(ls).toLowerCase())} ${esc(placeOf(ls))}, ${esc(relTime(ls.timestamp).toLowerCase())}. Seen something? Be the next.` : 'Seen a beaver, coyote or fox in the park? Be the first to log one.';
    return `<div class="peek" id="peek"><div class="first"><div class="a">${head}</div>${f ? `<div class="f">${f}</div>` : ''}</div>${btn}</div>`;
  }
  return `<div class="peek" id="peek"><div class="eyebrow">Best times to look</div>
    <div class="bets">${bets.map(b => { const t = phaseNext(b.peakPhase);
      return `<button class="bet" type="button" data-focus="${b.key}"><span class="e" aria-hidden="true">${SPECIES[b.key].emoji}</span>
        <span class="b"><span class="n">${esc(pluralOf(b.key))}</span><span class="w" style="display:block">${PHRASE[b.peakPhase]}${b.topSpot ? ' · ' + esc(b.topSpot) : ''}</span></span>
        <span class="t"><b${t.now ? ' style="color:var(--good)"' : ''}>${esc(t.big)}</b>${esc(t.small)}</span></button>`; }).join('')}</div>${btn}</div>`;
}
function chipsHtml(){
  const fk = focusKey(), counts = {};
  state.sightings.forEach(s => { if(valid(s) && inRange(s)){ const k = spKey(s); counts[k] = (counts[k] || 0) + 1; } });
  const keys = Array.from(new Set(REGULARS.concat(Object.keys(counts).filter(k => k !== 'other').sort((a, b) => counts[b] - counts[a]).slice(0, 4))));
  if(fk && !keys.includes(fk)) keys.unshift(fk);
  const custom = (!allSpeciesOn() && !fk) || state.filters.range !== 'all';
  const nf = (!allSpeciesOn() && !fk ? 1 : 0) + (state.filters.range !== 'all' ? 1 : 0);
  return `<div class="chips" role="toolbar" aria-label="Show species">
    <button class="chip" type="button" data-all="1" aria-pressed="${allSpeciesOn()}">All</button>
    ${keys.map(k => `<button class="chip" type="button" data-focus="${k}" aria-pressed="${fk === k}"><span aria-hidden="true">${SPECIES[k].emoji}</span>${esc(pluralOf(k))}</button>`).join('')}

function rangeLabel(){

  return (RANGES.find(r => r[0] === f.range) || ['', 'All time'])[1];
}
function rangePhrase(){
  const r = state.filters.range;
  if(r === 'all') return 'yet';
  if(r === 'custom') return 'in that date range';

  return 'in the last ' + rangeLabel().toLowerCase();
}
function renderHome(){

      const pmax = Math.max(1, ...PHASES.map(p => a.pc[p.key])), today = sunFor(new Date());
      html += `<div class="phases">${PHASES.map(p => `<div class="phase${a.n >= 5 && p.key === a.peakPhase ? ' pk' : ''}"><span class="pl">${p.label}<small>${p.hint}</small></span><span class="bar"><i style="width:${Math.round(a.pc[p.key] / pmax * 100)}%"></i></span><span class="v">${a.pc[p.key]}</span></div>`).join('')}</div>

    }
    if(!fk){
      const counts = {}; list.forEach(s => { const k = spKey(s); counts[k] = (counts[k] || 0) + 1; });
      const ranked = Object.entries(counts).sort((x, y) => y[1] - x[1]).slice(0, 6), rmax = ranked[0][1];
      html += `<div class="sec"><div class="sec-head"><h2 class="h">Most seen</h2></div>${ranked.map(([k, v]) =>

    }
    if(a.n >= 5) html += `<p class="note">Patterns reflect when people were out looking, not only when animals are active.${state.mode === 'demo' ? ' These use sample data.' : ''}</p>`;
  }

  // community + alerts + export
  const speciesSeen = new Set(state.sightings.map(spKey)).size;
  const people = new Set(state.sightings.filter(s => !s.sample && s.source !== 'historical-import').map(s => s.reporterId)).size;
  html += `<div class="sec"><div class="stats"><div class="stat"><b>${state.sightings.length}</b><span>Sightings</span></div><div class="stat"><b>${speciesSeen}</b><span>Species</span></div><div class="stat"><b>${people}</b><span>Neighbors</span></div></div></div>`;
  const watchKeys = Array.from(new Set(REGULARS.concat(['skunk'], Array.from(state.watch)))).filter(k => SPECIES[k]);
  html += `<div class="sec"><div class="sec-head"><h2 class="h">Heads-up alerts</h2></div><p class="sub" style="margin:-4px 0 10px">Get a notice when a neighbor logs one of these while you have this page open.</p>
    <div class="chips wrapchips">${watchKeys.map(k => `<button class="chip" type="button" data-watch="${k}" aria-pressed="${state.watch.has(k)}"><span aria-hidden="true">${SPECIES[k].emoji}</span>${esc(pluralOf(k))}</button>`).join('')}</div></div>`;
  html += `<div class="sec" style="text-align:center"><button class="link" type="button" data-go="export">Download this view as a spreadsheet (CSV)</button>
    <p class="note">Map data © OpenStreetMap contributors${TILES.carto ? ', © CARTO' : ''}. Landmark names are approximate.</p></div>`;

  const el = $('#viewHome');
  const hadFocus = document.activeElement && document.activeElement.id === 'listSearch';
  const pos = hadFocus ? document.activeElement.selectionStart : 0;
  el.innerHTML = html;
  if(hadFocus){ const f = $('#listSearch'); if(f){ f.focus(); try{ f.setSelectionRange(pos, pos); }catch(e){} } }
  if(state.view === 'home' && sheet.detent === 'peek') applySheet();
}

function arcPath(cx, cy, r0, r1, a0, a1){
  const p = (r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  const [x0, y0] = p(r1, a0), [x1, y1] = p(r1, a1), [x2, y2] = p(r0, a1), [x3, y3] = p(r0, a0);
  const large = a1 - a0 > Math.PI ? 1 : 0;
  return `M${x0.toFixed(2)},${y0.toFixed(2)} A${r1},${r1} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} L${x2.toFixed(2)},${y2.toFixed(2)} A${r0},${r0} 0 ${large} 0 ${x3.toFixed(2)},${y3.toFixed(2)} Z`;
}
function clockSvg(hours, peak, len, n){
  const S = 272, c = S / 2, r0 = 48, rMax = 104, max = Math.max(1, ...hours);
  const ang = h => (h / 24) * Math.PI * 2 - Math.PI / 2;
  let s = `<svg viewBox="0 0 ${S} ${S}" width="${S}" height="${S}" style="max-width:100%;height:auto" role="img" aria-label="Sightings by hour of day. Busiest window ${hourRange(peak, len)}.">`;
  const sun = sunFor(new Date()), hrs = d => d.getHours() + d.getMinutes() / 60;
  s += `<path d="${arcPath(c, c, r0 - 4, rMax + 4, ang(hrs(sun.set)), ang(hrs(sun.rise) + 24))}" style="fill:var(--lake-soft)"/>`;
  s += `<circle cx="${c}" cy="${c}" r="${r0 - 4}" style="fill:var(--surface);stroke:var(--line)"/>`;
  for(let h = 0; h < 24; h++){
    const v = hours[h]; if(!v) continue;
    const r1 = r0 + (rMax - r0) * (v / max);
    const inPeak = ((h - peak + 24) % 24) < len && n >= 5;
    s += `<path d="${arcPath(c, c, r0, r1, ang(h) + 0.025, ang(h + 1) - 0.025)}" style="fill:${inPeak ? 'var(--accent)' : 'var(--ink-3)'}"><title>${hourRange(h,1)}: ${v}</title></path>`;
  }
  [[0,'12a'],[6,'6a'],[12,'12p'],[18,'6p']].forEach(([h, t]) => {
    const a = ang(h), x = c + (rMax + 18) * Math.cos(a), y = c + (rMax + 18) * Math.sin(a);
    s += `<text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="middle" font-size="11" style="fill:var(--ink-3)" font-weight="600">${t}</text>`;
  });
  s += n >= 5
    ? `<text x="${c}" y="${c - 2}" text-anchor="middle" font-size="15" font-weight="700" style="fill:var(--ink)">${hourRange(peak, len)}</text><text x="${c}" y="${c + 14}" text-anchor="middle" font-size="10" style="fill:var(--ink-3)" font-weight="600" letter-spacing="1">BUSIEST</text>`
    : `<text x="${c}" y="${c + 4}" text-anchor="middle" font-size="11" style="fill:var(--ink-3)" font-weight="600">needs more data</text>`;
  return s + '</svg>';
}

function startLog(editing){
  if(map) map.closePopup();
  state.detailId = null;
  state.log = { step:1, draft: freshDraft(), editing: editing || null, showAll:false, query:'', result:null };
  if(editing){
    const s = editing, d = state.log.draft;
    Object.assign(d, { species: spKey(s), customLabel: s.customLabel || '', precision: s.precision || 'exact', confidence: s.confidence || 'probable',
      count: s.count || 1, notes: s.notes || '', sensitive: !!s.sensitive, timeMode:'earlier', time: localInput(s.timestamp) });
    const inline = safeImg(s.photo) || safeImg(s.photoUrl);
    if(inline){ d.photo = inline; d.photoDirty = true; } // move older inline photos into their own document on save
    else if(s.hasPhoto) getPhoto(s).then(p => { if(state.log && state.log.draft === d && !d.photoDirty){ d.photo = p; if(state.log.step === 3) renderLog(); } }).catch(() => {});
    state.log.step = 3;
    showView('log');
    placeDraft({ lat:s.lat, lng:s.lng }, 'edit');
    renderLog();
    setDetent('full');
    renderMap();
    return;
  }
  showView('log');
  renderLog();
  setDetent('full');
  renderMap();
}
function endLog(){
  state.log = null; clearDraftMarker();
  goHome();
}
function goStep(n){
  const lg = state.log; lg.step = n;
  showView('log'); renderLog();
  if(n === 2){
    setDetent('fit');
    if(!lg.draft.latlng){
      lg.locating = true; renderLog();
      locate(ll => {
        if(!state.log || state.log !== lg) return;
        lg.locating = false;
        if(ll && inBounds(ll.lat, ll.lng) && !lg.draft.latlng) placeDraft(ll, 'gps');
        else { renderLog(); if(map && map.getZoom() < 16) flyToVisible(map.getCenter(), 16); }
        setDetent('fit');
      }, true);
    } else if(map) flyToVisible(lg.draft.latlng);
  } else setDetent('full');
}
function missing(d){

  if(!d.latlng) m.push('a spot on the map');
  if(d.timeMode === 'earlier' && (!d.time || isNaN(Date.parse(d.time)))) m.push('a date and time');
  return m;
}
