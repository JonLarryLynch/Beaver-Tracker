function resizeImage(file){
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onerror = () => rej(new Error('read'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('decode'));
      img.onload = () => {
        const max = 800, k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        let q = 0.72, out = c.toDataURL('image/jpeg', q);
        while(out.length > 300000 && q > 0.35){ q -= 0.1; out = c.toDataURL('image/jpeg', q); }
        res(out);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function saveLog(){
  const lg = state.log; if(!lg || lg.saving) return;
  if(state.mode === 'connecting'){ toast('Still connecting to the shared map. Try again in a second.'); return; }
  const d = lg.draft, ed = lg.editing;
  if(missing(d).length) return;
  const { lat, lng } = d.latlng;
  if(!inBounds(lat, lng)){ toast('That pin is outside the Lincoln Park area.', 'warn'); goStep(2); return; }
  if(!ed){
    const last = Number(ls.get('lpww.lastPost') || 0), wait = Math.ceil((last + RATE_LIMIT_SEC * 1000 - Date.now()) / 1000);
    if(state.mode === 'cloud' && wait > 0){ toast(`One moment: there’s a short pause between sightings to keep out spam. Try again in ${wait} s.`, 'warn'); return; }
  }
  // Den / lodge / nest: snap to the centre of a ~300 m grid cell so the exact spot is never stored.
  const blur = v => Number((Math.floor(v / BLUR_DEG) * BLUR_DEG + BLUR_DEG / 2).toFixed(6));
  const nowIso = new Date().toISOString();
  const when = d.timeMode === 'now' ? nowIso : new Date(d.time).toISOString();
  if(Date.parse(when) > Date.now() + 5 * 60000){ toast('That time is in the future.', 'warn'); return; }
  const photoOp = d.photoDirty ? (d.photo || null) : undefined;
  const willHavePhoto = photoOp === undefined ? !!(ed && hasPhoto(ed)) : !!photoOp;
  const entry = {
    id: ed ? ed.id : newId(),
    species: d.species,
    customLabel: d.species === 'other' ? d.customLabel.trim().slice(0, 60) : '',
    lat: d.sensitive ? blur(lat) : Number(lat.toFixed(6)),
    lng: d.sensitive ? blur(lng) : Number(lng.toFixed(6)),
    sensitive: !!d.sensitive,
    timestamp: when,
    confidence: d.confidence, precision: d.sensitive ? 'approximate' : d.precision,
    count: Math.max(1, Math.min(99, d.count | 0)),
    notes: d.notes.trim().slice(0, 1000),
    hasPhoto: willHavePhoto,
    reporterName: state.name || '',
    reporterId: state.uid,
    createdAt: ed && ed.createdAt ? ed.createdAt : nowIso,
    updatedAt: nowIso
  };
  lg.saving = true; renderLog();
  try{
    await persist(entry, !ed, photoOp, ed);
    if(!ed) ls.set('lpww.lastPost', String(Date.now()));
    const monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0,0,0,0);
    const sameMonth = state.sightings.filter(s => spKey(s) === spKey(entry) && Date.parse(s.timestamp) >= +monthStart).length + (state.sightings.some(s => s.id === entry.id) ? 0 : 1);
    const nm = spKey(entry) === 'other' ? 'sighting of ' + (entry.customLabel || 'other wildlife') : SPECIES[entry.species].label.toLowerCase();
    let line = ed ? 'Your changes are saved.' : `That’s the ${ordinal(sameMonth)} ${nm} logged this month.`;
    if(entry.sensitive) line += ' The location was blurred to protect the animals.';
    if(state.mode === 'demo' && !ed) line += ' (Demo mode: kept in this browser only.)';
    lg.saving = false; lg.step = 4; lg.result = { line, edited: !!ed, coyote: entry.species === 'coyote', id: entry.id };
    clearDraftMarker();
    state.justLogged = entry.id; setTimeout(() => { if(state.justLogged === entry.id){ state.justLogged = null; } }, 1500);
    renderLog(); setDetent('fit');
    renderAll();
    if(map) flyToVisible([entry.lat, entry.lng]);
  }catch(e){
    lg.saving = false; renderLog();
    toast('Couldn’t save: ' + (e.code === 'permission-denied' ? `the database turned it down. If you just logged one, wait ${RATE_LIMIT_SEC} seconds and try again.` : (e.message || 'unknown error')), 'warn');
  }
}

async function confirmDelete(id){
  const s = state.sightings.find(x => x.id === id); if(!s) return;
  const ok = await openModal({ title:'Delete this sighting?', body:`Your ${labelOf(s).toLowerCase()} from ${fmtWhen(s.timestamp)} will be removed for everyone.`, confirmText:'Delete', danger:true });
  if(!ok) return;
  try{ await removeSighting(s); toast('Sighting deleted'); goHome(); }
  catch(e){ toast('Couldn’t delete: ' + (e.message || 'error'), 'warn'); }
}
async function reportSighting(id){
  const s = state.sightings.find(x => x.id === id); if(!s) return;
  const reason = await openModal({ title:'Report a problem', body:'What’s wrong with this sighting? A moderator will take a look.', input:{ multiline:true, placeholder:'e.g. Wrong species, a joke entry, an inappropriate note', maxLength:500 }, confirmText:'Send report' });
  if(reason === null) return;
  if(state.mode === 'cloud'){
    try{ await withTimeout(Cloud.db.collection('flags').add({ sightingId:id, reason: String(reason).slice(0,500), flaggedBy: state.uid, flaggedByName: state.name || '', timestamp: new Date().toISOString() }), 10000, 'Timed out'); toast('Thanks. Report sent.'); }
    catch(e){ toast('Couldn’t send the report right now.', 'warn'); }
  } else toast('Report noted (demo mode, nothing was sent).');
}

/* ================================================================
   FILTERS, MENU, EXPORT, SHARE, ALERTS
   ================================================================ */
function openFilters(){
  const counts = {}; state.sightings.forEach(s => { const k = spKey(s); counts[k] = (counts[k] || 0) + 1; });
  const f = state.filters;
  let html = `<label class="fl" style="margin-top:4px">Time range</label><div class="chips wrapchips" id="fRange">${RANGES.concat([['custom','Custom']]).map(([v, l]) => `<button class="chip" type="button" data-r="${v}" aria-pressed="${f.range === v}">${l}</button>`).join('')}</div>
    <div class="two" id="fCustom" style="margin-top:10px" ${f.range === 'custom' ? '' : 'hidden'}><input class="input" type="date" id="fFrom" value="${esc(f.from)}" aria-label="From date"><input class="input" type="date" id="fTo" value="${esc(f.to)}" aria-label="To date"></div>
    <div class="sec-head" style="margin-top:20px;margin-bottom:0"><span class="fl" style="margin:0">Species</span><span><button class="link" type="button" id="fAll" style="font-size:14.5px">All</button> · <button class="link" type="button" id="fNone" style="font-size:14.5px">None</button></span></div>
    <div id="fList">`;
  Object.keys(GROUPS).forEach(g => {
    const keys = SPECIES_KEYS.filter(k => SPECIES[k].group === g);
    html += `<div class="pop-group">${GROUPS[g].label}</div>` + keys.map(k => `<label class="check-row"><input type="checkbox" data-f="${k}" ${f.species.has(k) ? 'checked' : ''}>${SPECIES[k].emoji} ${esc(nameOf(k))}<span class="n">${counts[k] || 0}</span></label>`).join('');
  });
  html += `</div>`;
  openModal({ title:'Filters', html, hideCancel:true, confirmText:'Done', onOpen: body => {
    $('#fRange', body).addEventListener('click', e => {
      const b = e.target.closest('[data-r]'); if(!b) return;
      f.range = b.dataset.r; $$('[data-r]', body).forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      $('#fCustom', body).hidden = f.range !== 'custom'; renderAll();
    });
    $('#fFrom', body).addEventListener('change', e => { f.from = e.target.value; renderAll(); });
    $('#fTo', body).addEventListener('change', e => { f.to = e.target.value; renderAll(); });
    $('#fList', body).addEventListener('change', e => { const k = e.target.dataset.f; if(!k) return; if(e.target.checked) f.species.add(k); else f.species.delete(k); renderAll(); });
    $('#fAll', body).onclick = () => { f.species = new Set(SPECIES_KEYS); $$('[data-f]', body).forEach(x => x.checked = true); renderAll(); };
    $('#fNone', body).onclick = () => { f.species = new Set(); $$('[data-f]', body).forEach(x => x.checked = false); renderAll(); };
  }});
}
function openLayers(){
  const opt = (v, e, t, d) => `<button class="row" type="button" data-base="${v}" aria-pressed="${state.base === v}"><span class="ic" aria-hidden="true">${e}</span><span class="b"><span class="n">${t}</span><span class="m">${d}</span></span><span class="chev" aria-hidden="true">${state.base === v ? '✓' : ''}</span></button>`;
  openModal({ title:'Map', noActions:true, html:`<div class="menu group">
    ${opt('map', '🗺️', 'Street map', 'Paths, ponds, buildings and street names')}
    ${opt('sat', '🛰️', 'Satellite', 'Aerial photo for pinning an exact tree or shoreline spot')}
    </div><div class="menu group" style="margin-top:12px">
    <button class="row" type="button" data-heat="1"><span class="ic" aria-hidden="true">🔥</span><span class="b"><span class="n">Heatmap</span><span class="m">Show where sightings cluster instead of pins</span></span><span class="chev">${state.heat ? 'On' : 'Off'}</span></button>
    </div><button class="btn btn-block" type="button" data-close="1" style="margin-top:12px">Done</button>`,
    onOpen: (body, close) => body.addEventListener('click', e => {
      const b = e.target.closest('[data-base]'), h = e.target.closest('[data-heat]');
      if(b){ state.base = b.dataset.base; ls.set('lpww.base', state.base); setTiles(); close(null); toast(state.base === 'sat' ? 'Satellite view' : 'Street map'); }
      else if(h){ state.heat = !state.heat; renderMap(); close(null); toast(state.heat ? 'Showing where sightings cluster' : 'Showing individual sightings'); }
      else if(e.target.closest('[data-close]')) close(null);
    })
  });
}
function openMenu(){
  const status = state.mode === 'cloud' ? 'Live: shared with everyone' : state.mode === 'demo' ? 'Demo mode' : 'Connecting…';
  openModal({ title:'', noActions:true, html:`<div class="menu group">
    <button class="row" type="button" data-m="name"><span class="ic" aria-hidden="true">👤</span><span class="b"><span class="n">Your name</span><span class="m">${esc(state.name || 'Anonymous')}</span></span><span class="chev">›</span></button>
    <button class="row" type="button" data-m="status"><span class="ic" aria-hidden="true">${state.mode === 'cloud' ? '🟢' : state.mode === 'demo' ? '🟠' : '⚪'}</span><span class="b"><span class="n">Connection</span><span class="m">${esc(status)}</span></span><span class="chev">›</span></button>
    <button class="row" type="button" data-m="export"><span class="ic" aria-hidden="true">⬇</span><span class="b"><span class="n">Download as CSV</span><span class="m">The sightings in the current view</span></span></button>
    <button class="row" type="button" data-m="about"><span class="ic" aria-hidden="true">ℹ️</span><span class="b"><span class="n">About Wildlife Watch</span></span><span class="chev">›</span></button>
    </div><button class="btn btn-block" type="button" data-m="close" style="margin-top:12px">Close</button>`,
    onOpen: (body, close) => body.addEventListener('click', e => {
      const b = e.target.closest('[data-m]'); if(!b) return;
      close(null);
      const m = b.dataset.m;
      setTimeout(() => { if(m === 'name') editName(); else if(m === 'status') showStatus(); else if(m === 'export') exportCsv(); else if(m === 'about') showAbout(); }, 60);
    })
  });
}
async function editName(){
  const v = await openModal({ title:'Your name on sightings', body:'Shown as “Logged by” on sightings you add from this browser. A name next to exact times and places can reveal when you usually walk where, so blank is completely fine. A first name or nickname works well.', input:{ value: state.name, placeholder:'e.g. Jon L.', maxLength:40 }, confirmText:'Save' });
  if(v === null) return;
  state.name = String(v).trim().slice(0, 40); ls.set('lpww.name', state.name);
  toast(state.name ? 'Your sightings will say “' + state.name + '”' : 'You’ll log sightings anonymously');
}
function showStatus(){
  if(state.mode === 'cloud'){ openModal({ title:'Live', body: state.modeReason, hideCancel:true, confirmText:'Got it' }); return; }
  if(state.mode !== 'demo'){ openModal({ title:'Connecting', body: state.modeReason, hideCancel:true, confirmText:'OK' }); return; }
  openModal({
    title:'Demo mode',
    html:`<p>${esc(state.modeReason)}</p><p>Everything works for testing. The map is filled with sample sightings, marked “Sample,” so the patterns have something to show. Sightings you log are kept in this browser only.</p><p><button class="link" type="button" id="resetDemo">Remove the sightings I logged in demo mode</button></p>`,
    hideCancel:true, confirmText:'Got it',
    onOpen: (body, close) => { const b = $('#resetDemo', body); if(b) b.onclick = () => { Demo.reset(); photoCache.clear(); state.sightings = Demo.load(); close(true); renderAll(); toast('Your demo sightings were removed'); }; }
  });
}
function showAbout(){
  openModal({ title:'About Wildlife Watch', hideCancel:true, confirmText:'Close', html:`<p>A community log of wildlife in Chicago’s Lincoln Park. Neighbors log what they see, and the patterns show when and where each animal tends to turn up.</p>
    <p>Den, lodge and nest locations are blurred before they’re saved. Anyone can report a sighting that looks wrong, and moderators review reports.</p>
    <p>Some older records come from iNaturalist and are credited to their observers.</p>` });
}
function exportCsv(){
  const rows = filtered();
  const cols = ['species','custom_label','latitude','longitude','timestamp','near','count','confidence','location_precision','notes','reported_by','source','license','sample'];
  const q = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = [cols.join(',')].concat(rows.map(s => [labelOf(s), s.customLabel || '', s.lat, s.lng, s.timestamp, placeOf(s).replace(/^near /, ''), s.count || 1, s.confidence || '', s.precision || '', s.notes || '', s.source === 'historical-import' ? (s.observer || 'iNaturalist') : (s.reporterName || ''), s.source || '', s.license || '', s.sample ? 'yes' : ''].map(q).join(','))).join('\n');
  try{
    const url = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = 'lincoln-park-sightings-' + new Date().toISOString().slice(0,10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast(`Downloaded ${rows.length} sightings`);
  }catch(e){ toast('Downloads are blocked here. Try on the live site.', 'warn'); }
}
function maybeAlert(s){
  if(isMine(s) || !state.watch.has(spKey(s))) return;
  const msg = `${sp(s.species).emoji} ${labelOf(s)} just logged ${placeOf(s)}`;
  toast(msg);
  try{ if('Notification' in window && Notification.permission === 'granted') new Notification('Lincoln Park Wildlife Watch', { body: msg }); }catch(e){}
}
function linkFor(id){ return location.origin + location.pathname + '?s=' + encodeURIComponent(id); }
async function shareSighting(id){
  const s = state.sightings.find(x => x.id === id); if(!s) return;
  const url = linkFor(id);
  const text = `${sp(s.species).emoji} ${labelOf(s)} ${placeOf(s)}, ${fmtWhen(s.timestamp)}`;
  if(s.sample) toast('Heads up: this is sample data, so the link only works in demo mode.');
  try{ if(navigator.share){ await navigator.share({ title:'Lincoln Park Wildlife Watch', text, url }); return; } }
  catch(e){ if(e && e.name === 'AbortError') return; }
  try{ await navigator.clipboard.writeText(text + '\n' + url); toast('Link copied'); return; }catch(e){}
  openModal({ title:'Share this sighting', body:'Copy this link:', input:{ value:url, maxLength:500 }, hideCancel:true, confirmText:'Done',
    onOpen: body => { const f = $('input', body); if(f){ f.readOnly = true; setTimeout(() => f.select(), 40); } } });
}
function handleDeepLink(){
  if(!state.pendingLink || state.mode === 'connecting') return;
  const id = state.pendingLink; state.pendingLink = null;
  const s = state.sightings.find(x => x.id === id);
  if(!s){ toast('That shared sighting isn’t on the map anymore.', 'warn'); return; }
  if(!filtered().some(x => x.id === id)){ state.filters.species = new Set(SPECIES_KEYS); state.filters.range = 'all'; }
  setTimeout(() => { renderAll(); openDetail(id, true); }, 0);
}

/* ================================================================
   RENDER
   ================================================================ */
function renderChrome(){
  $('#connChip').hidden = state.mode !== 'connecting';
  $('#demoChip').hidden = state.mode !== 'demo';

}
let framed = false;
function frameAll(){
  if(!map || framed || state.mode === 'connecting' || state.pendingLink) return;
  const pts = filtered().map(s => [s.lat, s.lng]); if(!pts.length) return;
  framed = true;
  map.fitBounds(L.latLngBounds(pts), { paddingTopLeft:[isDesktop() ? 440 : 24, isDesktop() ? 30 : 80], paddingBottomRight:[isDesktop() ? 30 : 70, isDesktop() ? 30 : sheetTarget() + 16], maxZoom:15, animate:false });
}
function renderAll(){
  renderChrome(); renderMap(); renderHome(); frameAll();
  if(state.view === 'detail') renderDetail();
  handleDeepLink();
}

/* ================================================================
   EVENTS
   ================================================================ */
function focusSpecies(k){
  state.filters.species = new Set([k]); state.listLimit = 8;
  renderAll();
  const sub = filtered();
  if(map && sub.length){
    const b = L.latLngBounds(sub.map(s => [s.lat, s.lng]));
    map.flyToBounds(b, { paddingTopLeft:[isDesktop() ? 440 : 30, 70], paddingBottomRight:[30, isDesktop() ? 30 : sheetTarget() + 20], maxZoom:16, duration:0.7 });
  }
}
function wire(){
  const sb = $('#sheetBody');
  sb.addEventListener('click', async e => {
    const t = e.target;
    let b;
    if((b = t.closest('[data-open]'))){ openDetail(b.dataset.open); return; }
    if((b = t.closest('[data-focus]'))){ focusSpecies(b.dataset.focus); return; }
    if((b = t.closest('[data-all]'))){ state.filters.species = new Set(SPECIES_KEYS); renderAll(); return; }
    if((b = t.closest('[data-range]'))){ state.filters.range = b.dataset.range; renderAll(); return; }
    if((b = t.closest('[data-more]'))){ state.listLimit += 20; renderHome(); return; }
    if((b = t.closest('[data-tm]'))){ state.timeMode = b.dataset.tm; renderHome(); return; }
    if((b = t.closest('[data-spot]'))){ const l = LANDMARKS.find(x => x.name === b.dataset.spot); if(l) flyToVisible([l.lat, l.lng], 16); return; }
    if((b = t.closest('[data-watch]'))){
      const k = b.dataset.watch;
      if(state.watch.has(k)) state.watch.delete(k); else {
        state.watch.add(k);
        try{ if('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {}); }catch(err){}
      }
      ls.set('lpww.watch', JSON.stringify(Array.from(state.watch)));
      b.setAttribute('aria-pressed', String(state.watch.has(k)));
      return;
    }
    if((b = t.closest('[data-go]'))){
      const g = b.dataset.go;
      if(g === 'log') startLog(); else if(g === 'filters') openFilters(); else if(g === 'export') exportCsv();
      return;
    }
    if((b = t.closest('[data-back]'))){ goHome(); return; }
    if((b = t.closest('[data-act]'))){
      const id = state.detailId, a = b.dataset.act;
      if(a === 'share') shareSighting(id);
      else if(a === 'edit'){ const s = state.sightings.find(x => x.id === id); if(s) startLog(s); }
      else if(a === 'delete') confirmDelete(id);
      else if(a === 'report') reportSighting(id);
      return;
    }
    // log flow
    const lg = state.log; if(!lg) return;
    if((b = t.closest('[data-sp]'))){
      lg.draft.species = b.dataset.sp;
      if(draftMarker) draftMarker.setIcon(draftIcon());
      if(b.dataset.sp === 'other'){ renderLog(); setTimeout(() => { const f = $('#customLabel'); if(f) f.focus(); }, 30); }
      else if(lg.editing || lg.draft.latlng){ goStep(3); }
      else goStep(2);
      return;
    }
    if((b = t.closest('[data-tmode]'))){ lg.draft.timeMode = b.dataset.tmode; renderLog(); if(lg.draft.timeMode === 'earlier'){ const f = $('#timeInput'); if(f) f.focus(); } return; }
    if((b = t.closest('[data-conf]'))){ lg.draft.confidence = b.dataset.conf; $$('[data-conf]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); return; }
    if((b = t.closest('[data-prec]'))){ lg.draft.precision = b.dataset.prec; $$('[data-prec]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); return; }
    if((b = t.closest('[data-log]'))){
      const a = b.dataset.log;
      if(a === 'cancel') endLog();
      else if(a === 'all'){ lg.showAll = true; renderLog(); }
      else if(a === 'next1'){ if(lg.draft.customLabel.trim()) goStep(lg.draft.latlng ? 3 : 2); else { const f = $('#customLabel'); if(f) f.focus(); } }
      else if(a === 'back1' || a === 'to1') goStep(1);
      else if(a === 'next2'){ goStep(3); }
      else if(a === 'back2' || a === 'to2') goStep(2);
      else if(a === 'gps'){ lg.locating = true; renderLog(); locate(ll => { lg.locating = false; if(ll){ if(!inBounds(ll.lat, ll.lng)) toast('You look to be outside Lincoln Park. Tap the map where you saw it.'); placeDraft(ll, 'gps'); } else renderLog(); setDetent('fit'); }); }
      else if(a === 'minus'){ lg.draft.count = Math.max(1, lg.draft.count - 1); $('#cntOut').textContent = lg.draft.count; }
      else if(a === 'plus'){ lg.draft.count = Math.min(99, lg.draft.count + 1); $('#cntOut').textContent = lg.draft.count; }
      else if(a === 'rmphoto'){ lg.draft.photo = null; lg.draft.photoDirty = true; lg.detailsOpen = true; renderLog(); }
      else if(a === 'save') saveLog();
      else if(a === 'again'){ startLog(); }
      else if(a === 'done'){ const id = lg.result && lg.result.id; state.log = null; goHome(); if(id && state.sightings.some(s => s.id === id)) setTimeout(() => openDetail(id, false), 200); }
    }
  });
  sb.addEventListener('input', e => {
    const t = e.target, lg = state.log;
    if(t.id === 'listSearch'){ state.listQuery = t.value; state.listLimit = 8; renderHome(); return; }
    if(!lg) return;
    if(t.id === 'spSearch'){ lg.query = t.value; const pos = t.selectionStart; renderLog(); const f = $('#spSearch'); if(f){ f.focus(); try{ f.setSelectionRange(pos, pos); }catch(err){} } }
    else if(t.id === 'customLabel'){ lg.draft.customLabel = t.value; }
    else if(t.id === 'notesInput'){ lg.draft.notes = t.value; const n = $('#sensitiveNudge'); if(n) n.hidden = lg.draft.sensitive || !SENSITIVE_WORDS.test(t.value); }
  });
  sb.addEventListener('change', async e => {
    const t = e.target, lg = state.log; if(!lg) return;
    if(t.id === 'timeInput'){ lg.draft.time = t.value; renderLog(); }
    else if(t.id === 'sensitiveChk'){ lg.draft.sensitive = t.checked; const n = $('#sensitiveNudge'); if(n) n.hidden = lg.draft.sensitive || !SENSITIVE_WORDS.test(lg.draft.notes); }
    else if(t.id === 'photoInput'){
      const f = t.files && t.files[0]; if(!f) return;
      try{ lg.draft.photo = await resizeImage(f); lg.draft.photoDirty = true; lg.detailsOpen = true; renderLog(); }
      catch(err){ toast('That photo couldn’t be read. Try a JPG or PNG.', 'warn'); t.value = ''; }
    }
  });
  sb.addEventListener('toggle', e => { if(e.target.id === 'moreDetails' && state.log) state.log.detailsOpen = e.target.open; }, true);
  sb.addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.id === 'customLabel'){ e.preventDefault(); const b = $('[data-log="next1"]'); if(b) b.click(); } });

  $('#menuBtn').addEventListener('click', openMenu);
  $('#demoChip').addEventListener('click', showStatus);
  $('#basicChip').addEventListener('click', () => openModal({ title:'Basic map', hideCancel:true, confirmText:'Got it',
    body:'The detailed street map couldn’t load here, so you’re seeing a simple built-in map of the lakeshore and park landmarks. Everything else works. The full map appears on the live site.' }));
  $('#connChip').addEventListener('click', showStatus);
  $('#heatBtn').addEventListener('click', openLayers);
  $('#locateBtn').addEventListener('click', () => locate(ll => { if(ll && map) flyToVisible(ll, 16); }));
  document.addEventListener('keydown', e => {
    if(e.key !== 'Escape' || !$('#modal').hidden) return;
    if(state.view === 'detail') goHome();
  });
}

/* ================================================================
   START
   ================================================================ */
function start(){
  wire();
  wireSheet();
  initMap();
  showView('home');
  renderAll();
  setDetent(isDesktop() ? 'half' : 'peek');
  connectCloud().catch(e => goDemo(explainError(e)));
  if('serviceWorker' in navigator && location.protocol === 'https:' && window.self === window.top){
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
}
try{ start(); }
catch(e){
  console.error(e);
  document.body.insertAdjacentHTML('afterbegin', '<div style="position:fixed;top:0;left:0;right:0;z-index:9999;background:#B5452A;color:#fff;padding:10px 16px;font-weight:700">Something went wrong starting the app: ' + esc(e.message) + '</div>');
}
})();
</script>
</body>
